# Configuración para publicar el backend en Render (https://render.com)
# Render lee este archivo automáticamente al usar "New → Blueprint".
services:
  - type: web
    name: zaru-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # @supabase/supabase-js requiere Node 22 (WebSocket nativo).
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # HU-50: clave de cifrado de campos (openssl rand -base64 32). Se define en el panel de Render, nunca aquí.
      - key: ZARU_CLAVE_CIFRADO
        sync: false
      - key: FRONTEND_URL
        sync: false
