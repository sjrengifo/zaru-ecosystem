openapi: 3.1.0
info:
  title: API de ZARU Ecosystem
  version: 1.0.0
  summary: Backend del panel administrativo y de la app del cliente final de ZARU.
  description: |
    API REST multi-tenant de ZARU Ecosystem (Grupo Azul, Universidad Icesi).

    **Autenticación.** Las rutas privadas exigen `Authorization: Bearer <token>`, donde el token es el JWT
    que entrega Supabase Auth al iniciar sesión en el panel. Dura 1 hora. Si falta, venció o es inválido,
    la API responde `401 NO_AUTENTICADO` y el panel debe pedir iniciar sesión de nuevo (HU-44).

    **Multi-tenant.** Todo se filtra por el establecimiento del usuario autenticado. Un recurso de otro
    establecimiento responde `404 NO_ENCONTRADO`, igual que uno inexistente (HU-41).

    **Errores.** Todas las respuestas de error tienen el mismo formato (`Error`). Los errores de validación
    (`400 VALIDACION`) incluyen en `detalles` cada campo que debe corregirse (HU-43).

    **Versiones.** La versión actual es `/api/v1`. La ruta sin versión `/api` sigue funcionando para las
    aplicaciones ya desplegadas, pero responde con los encabezados `Deprecation: true` y
    `Link: </api/v1>; rel="successor-version"`. Una versión nueva se publica en `/api/v2` sin retirar las
    anteriores (HU-43).

    **Seguridad.** En producción solo se acepta HTTPS (TLS 1.2 o superior); una petición por HTTP recibe
    `426 HTTPS_REQUERIDO`. Las respuestas incluyen HSTS. El correo de los clientes se guarda cifrado
    (AES-256-GCM) y la API lo devuelve descifrado solo a usuarios autorizados (HU-50).

    **Rastreo.** Cada respuesta incluye `X-Request-Id`. Al reportar un error, indique ese valor.

    Las rutas con respuesta `501` están definidas pero pendientes de desarrollo en la historia indicada.
  contact:
    name: Grupo Azul · Gerencia de Proyectos de TI · Universidad Icesi
servers:
  - url: http://localhost:4000/api/v1
    description: Desarrollo local (versión 1)
  - url: /api/v1
    description: Mismo servidor (versión 1)
  - url: /api
    description: Ruta sin versión (obsoleta, equivale a v1)
tags:
  - name: Sistema
    description: Estado del servicio
  - name: Sesión
    description: HU-01, HU-44
  - name: Datos personales
    description: HU-51 (Ley 1581 de 2012)
  - name: Clientes
    description: HU-03, HU-04
  - name: Vehículos
    description: HU-05, HU-06
  - name: Servicios
    description: HU-07
  - name: Órdenes
    description: HU-08, HU-09, HU-10
  - name: Promociones
    description: HU-12
  - name: Usuarios
    description: HU-02
  - name: Establecimiento
    description: HU-13
  - name: Superadministración
    description: HU-57
  - name: Reportes
    description: HU-16
  - name: Seguimiento
    description: HU-18 (cliente final, sin sesión)
  - name: Acceso del cliente
    description: HU-17 (cliente final, sin sesión ni contraseña)
  - name: Notificaciones del cliente
    description: HU-38 (centro de notificaciones de la app, con el pase del historial)
security:
  - bearerPanel: []

paths:
  /health:
    get:
      tags: [Sistema]
      operationId: obtenerSalud
      summary: Comprobar que la API está en línea
      security: []
      responses:
        '200':
          description: La API está en línea.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
              example: { ok: true, servicio: zaru-api, version: 1.0.0, commit: 3f9c2a1b7d4e5f60718293a4b5c6d7e8f9012345, fecha: '2026-10-28T13:00:00.000Z' }

  /politicas-datos/vigente:
    get:
      tags: [Datos personales]
      operationId: obtenerPoliticaVigente
      summary: Política de tratamiento de datos vigente
      description: |
        Texto y versión de la política que se muestra al titular antes de registrar sus datos (HU-51 CA1).
        Es pública: la usan el panel y la app del cliente final. Al registrar un cliente se envía la
        `version` recibida en `politicaVersion`.
      security: []
      responses:
        '200':
          description: Política vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Politica' }
              example: { version: '1.0', titulo: Política de tratamiento de datos personales, contenido: '# Política de tratamiento de datos personales · versión 1.0 …', vigenteDesde: '2026-10-28T14:00:00Z' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/seguimiento/{codigo}:
    get:
      tags: [Seguimiento]
      operationId: obtenerSeguimientoPublico
      summary: Estado actual del lavado para el cliente final
      description: |
        Etapa actual del servicio con un texto claro (en cola, lavado iniciado, secado, listo para recoger,
        entregado) y el recorrido completo, con la marca de la sede (HU-18 CA1).

        Es pública: el cliente final entra con el código de seguimiento de su orden (enlace del correo de
        ingreso o el que le comparte el operario). No incluye nombre, teléfono ni correo del cliente.
        El código deja de responder 24 horas después de la entrega. Un código inexistente, vencido o de una
        sede suspendida responde el mismo `404`. Tras 10 códigos no válidos en 10 minutos desde el mismo
        origen, responde `429`.
      security: []
      parameters:
        - $ref: '#/components/parameters/CodigoSeguimiento'
      responses:
        '200':
          description: Seguimiento de la orden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seguimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /publico/seguimiento/{codigo}/eventos:
    get:
      tags: [Seguimiento]
      operationId: seguirLavadoEnVivo
      summary: Cambios de estado del lavado en tiempo real (Server-Sent Events)
      description: |
        Flujo `text/event-stream` que mantiene actualizada la pantalla del cliente sin recargarla (HU-18 CA2).

        - Al conectar (o reconectar) se envía el estado actual.
        - Cada vez que el operario cambia el estado en el panel se envía `event: estado` con el `Seguimiento`
          completo en `data` e `id` igual a la `version` de la orden.
        - Cada 25 s llega el comentario `: ping` para que los proxies no corten la conexión.
        - `retry: 5000`: si la conexión se corta, el navegador reconecta solo y recibe el estado más reciente.
        - Si el código vence o la sede se suspende, se envía `event: fin` y se cierra el flujo.

        Solo se emiten eventos de la orden de ese código.
      security: []
      parameters:
        - $ref: '#/components/parameters/CodigoSeguimiento'
        - name: Last-Event-ID
          in: header
          required: false
          description: Versión del último evento recibido. Al reconectar siempre se envía el estado actual.
          schema: { type: string }
      responses:
        '200':
          description: Flujo de eventos abierto.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 5000

                id: 3
                event: estado
                data: {"codigo":"7KQ2M9XH4P","estado":"en_lavado","etapa":{"estado":"en_lavado","titulo":"Lavado iniciado","paso":2,"totalPasos":5}}
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /publico/sedes/{slug}:
    get:
      tags: [Acceso del cliente]
      operationId: obtenerSedePublica
      summary: Nombre y marca de la sede del enlace del cliente final
      description: |
        Datos de la pantalla de inicio de la web móvil (HU-17 CA2 y CA3): el cliente llega desde el enlace o el
        código QR de su car wash (`/s/{slug}`). Solo devuelve nombre, logo y colores. Una sede inexistente o
        suspendida responde el mismo `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugSede'
      responses:
        '200':
          description: Sede pública.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SedePublica' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/sedes/{slug}/buscar:
    post:
      tags: [Acceso del cliente]
      operationId: buscarVehiculoEnServicio
      summary: Acceder al seguimiento con la placa o el celular
      description: |
        El cliente escribe su placa o su celular, sin contraseña (HU-17 CA1 y CA2). Si tiene una orden activa
        (no entregada) en la sede, recibe su código de seguimiento para abrir `/seguimiento/{codigo}` (HU-18).
        Con celular puede haber una orden por cada vehículo del cliente.

        Si no hay orden activa responde `404` con el mensaje "El vehículo no se encuentra en servicio
        actualmente", idéntico esté o no registrada la placa o el celular (HU-17 CA4). Nunca devuelve nombre,
        celular ni correo. Tras 5 búsquedas sin resultado en 10 minutos desde el mismo origen responde `429`.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugSede'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusquedaPublica' }
            examples:
              placa: { value: { placa: abc 123 } }
              celular: { value: { celular: '300 123 4567' } }
      responses:
        '200':
          description: Órdenes activas encontradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoBusquedaPublica' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404':
          description: Sin orden activa (o sede inexistente).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El vehículo no se encuentra en servicio actualmente, requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /publico/baja/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Token firmado del enlace "dejar de recibir" de un correo (HU-30 CA3). Solo sirve para esa autorización de ese cliente.
        schema: { type: string, maxLength: 500 }
    get:
      tags: [Acceso del cliente]
      operationId: consultarBaja
      summary: Qué autorización revoca el enlace "dejar de recibir"
      description: |
        Datos para la pantalla de confirmación: tipo de autorización, si sigue autorizada y la marca de la sede.
        No incluye datos personales. Un token alterado, o de un cliente que pidió eliminar sus datos, responde `404`.
      security: []
      responses:
        '200':
          description: Autorización del enlace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BajaPublica' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
    post:
      tags: [Acceso del cliente]
      operationId: confirmarBaja
      summary: Dejar de recibir avisos o promociones (sin iniciar sesión)
      description: |
        Revoca la autorización de inmediato y la registra como evidencia con canal `enlace_baja`, fecha, hora y
        versión de la política (HU-30 CA3 y CA4). Es `POST` para que las vistas previas de los correos, que abren
        los enlaces solas, no den de baja a nadie. Repetirlo no agrega filas nuevas.
      security: []
      responses:
        '200':
          description: Revocación confirmada.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/BajaPublica' }
                  - type: object
                    properties:
                      revocadaAt: { type: [string, 'null'], format: date-time }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /publico/sedes/{slug}/historial/acceso:
    post:
      tags: [Historial del cliente]
      operationId: accederHistorialCliente
      summary: Verificar placa y celular para abrir el historial de servicios
      description: |
        HU-23. El cliente final confirma que es dueño del vehículo con la **placa + el celular** registrados en
        esa sede. Si ambos coinciden, recibe un `pase` firmado de vida corta (30 minutos) que debe enviar como
        `Authorization: Bearer <pase>` en las rutas del historial.

        El pase identifica al establecimiento y al cliente dentro de la firma: no se puede alterar ni usar para
        otra sede. Si la placa o el celular no coinciden, la respuesta es el mismo `404` exista o no la placa
        (no revela quién es cliente de la sede). Tras 5 intentos fallidos en 10 minutos desde el mismo origen
        responde `429`.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugSede'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccesoHistorial' }
            example: { placa: ABC123, celular: '3001234567' }
      responses:
        '200':
          description: Pase emitido para consultar el historial de ese cliente en esa sede.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccesoHistorialRespuesta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404':
          description: La placa y el celular no coinciden con un vehículo de la sede (o la sede no existe).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: No encontramos un vehículo con esa placa y celular en esta sede, requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /publico/cliente/vehiculos:
    get:
      tags: [Historial del cliente]
      operationId: listarVehiculosCliente
      summary: Vehículos del cliente autenticado con el pase
      description: HU-23 CA2. Alimenta el filtro por placa del historial. Solo devuelve los vehículos del cliente del pase en esa sede.
      security:
        - paseCliente: []
      responses:
        '200':
          description: Vehículos del cliente.
          content:
            application/json:
              schema:
                type: object
                required: [vehiculos]
                properties:
                  vehiculos:
                    type: array
                    items: { $ref: '#/components/schemas/VehiculoCliente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /publico/cliente/historial:
    get:
      tags: [Historial del cliente]
      operationId: listarHistorialCliente
      summary: Servicios entregados del cliente, del más reciente al más antiguo
      description: |
        HU-23. Solo incluye órdenes en estado `entregado` de los vehículos del cliente del pase. Cada registro
        trae la fecha de entrega, la sede afiliada, la placa y el tipo de lavado (los servicios realizados).
        Se puede filtrar por una de las placas del cliente con `placa`.
      security:
        - paseCliente: []
      parameters:
        - name: placa
          in: query
          required: false
          description: Placa del vehículo del cliente por la que se filtra (sin espacios ni guiones).
          schema: { type: string, pattern: '^[A-Za-z0-9]{5,7}$' }
          example: ABC123
      responses:
        '200':
          description: Historial de servicios entregados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorialCliente' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /publico/cliente/historial/{ordenId}:
    get:
      tags: [Historial del cliente]
      operationId: obtenerDetalleHistorialCliente
      summary: Detalle de un servicio entregado del cliente
      description: |
        HU-24. Devuelve los servicios exactos realizados, la fecha, la sede, la placa y los totales de **una
        única** orden entregada del cliente del pase. Una orden de otro cliente, de otra sede o todavía no
        entregada responde el mismo `404`: no se revela que existe.
      security:
        - paseCliente: []
      parameters:
        - name: ordenId
          in: path
          required: true
          description: Identificador UUID de la orden entregada.
          schema: { type: string, format: uuid }
          example: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10
      responses:
        '200':
          description: Detalle del servicio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleHistorialCliente' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/cliente/notificaciones:
    get:
      tags: [Notificaciones del cliente]
      operationId: listarNotificacionesCliente
      summary: Centro de notificaciones del cliente (últimos 90 días)
      description: |
        HU-38 CA1 y CA2. Avisos que **le llegaron** al cliente del pase en esa sede (estado `enviada` o
        `entregada`) durante los últimos 90 días, del más reciente al más antiguo, con su marca de leída y
        `noLeidas`, el número de avisos pendientes para el contador de la app.

        HU-38 CA3: cada aviso de estado trae `destino`. Si el vehículo sigue en servicio es
        `{ pantalla: seguimiento, codigo }`; si ya se entregó, `{ pantalla: historial, ordenId }` para abrir
        el detalle del servicio. Los demás avisos traen `destino: null`.
      security:
        - paseCliente: []
      responses:
        '200':
          description: Avisos del cliente y cuántos siguen sin leer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CentroNotificacionesCliente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /publico/cliente/notificaciones/{id}/leida:
    patch:
      tags: [Notificaciones del cliente]
      operationId: marcarNotificacionClienteLeida
      summary: Marcar un aviso del cliente como leído
      description: |
        HU-38. Guarda la fecha y hora en que el cliente abrió el aviso. Repetirlo no cambia esa fecha. Un aviso
        de otro cliente, de otra sede o que no le llegó responde el mismo `404`.
      security:
        - paseCliente: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del aviso.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aviso marcado como leído.
          content:
            application/json:
              schema:
                type: object
                required: [id, leida, leidaAt]
                properties:
                  id: { type: string, format: uuid }
                  leida: { type: boolean, const: true }
                  leidaAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /me:
    get:
      tags: [Sesión]
      operationId: obtenerSesion
      summary: Datos de la sesión actual
      description: Usuario, rol, establecimiento, permisos de módulos y vencimiento del token (HU-44, HU-57, HU-59).
      responses:
        '200':
          description: Sesión válida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
              example:
                usuario: { id: 00000000-0000-0000-0000-0000000a0058, nombre: Admin Spike A, rol: admin }
                establecimiento: { id: 00000000-0000-0000-0000-00000000a058, nombre: Lavadero A, logo_url: null, color_primario: '#2563EB', color_secundario: '#0EA5E9' }
                sesion: { expiraEn: '2026-10-28T14:00:00.000Z' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /clientes:
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Listar y buscar clientes
      description: Clientes del establecimiento, ordenados por nombre, con las placas de sus vehículos (HU-04 CA1).
      parameters:
        - name: buscar
          in: query
          description: Texto a buscar en el nombre, el teléfono o la placa, sin distinguir mayúsculas ni tildes (máximo 60 caracteres).
          schema: { type: string, maxLength: 60 }
          example: Ana
      responses:
        '200':
          description: Lista de clientes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClienteResumen' }
              example:
                - { id: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10, nombre: Ana Gómez, telefono: '3001234567', correo: ana@correo.com, vehiculos: [{ placa: ABC123 }] }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Clientes]
      operationId: crearCliente
      summary: Registrar un cliente
      description: |
        Exige la autorización de tratamiento de datos (Ley 1581 de 2012, HU-03 CA2) y la versión de la política
        aceptada (HU-51). El cliente y la evidencia de la autorización (fecha, hora, versión, canal, IP y usuario)
        se guardan en una sola transacción: si la autorización falta o la versión no es la vigente, no se guarda
        ningún dato personal (HU-51 CA3). Si la política cambió mientras se llenaba el formulario, responde `409`
        en `politicaVersion` y hay que mostrar la versión nueva.
        Si el teléfono ya existe en el establecimiento responde `409` con el cliente existente en `detalles` (HU-03 CA3).
        El establecimiento se toma de la sesión; un `establecimiento_id` en el cuerpo se ignora.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteNuevo' }
            example: { nombre: Ana Gómez, telefono: '3001234567', correo: ana@correo.com, autorizacionDatos: true, politicaVersion: '1.0' }
      responses:
        '201':
          description: Cliente registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400':
          description: Datos inválidos o incompletos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene datos inválidos
                  detalles:
                    - { campo: telefono, mensaje: El teléfono debe ser un celular colombiano de 10 dígitos que empiece por 3 }
                    - { campo: autorizacionDatos, mensaje: La autorización de tratamiento de datos es obligatoria (Ley 1581 de 2012) }
                  requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409':
          description: Ya existe un cliente con ese teléfono en el establecimiento, o la versión de la política aceptada ya no es la vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: CONFLICTO
                  mensaje: Ya existe un cliente con ese teléfono
                  detalles: [{ campo: telefono, mensaje: El teléfono ya está registrado a nombre de Ana Gómez, clienteId: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10 }]
                  requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a

  /clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Consultar un cliente con sus vehículos
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Clientes]
      operationId: actualizarCliente
      summary: Editar los datos de contacto de un cliente
      description: HU-04 CA2. Se envían solo los campos a cambiar (al menos uno).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteCambios' }
            example: { telefono: '3109876543' }
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El teléfono ya pertenece a otro cliente del establecimiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: CONFLICTO
                  mensaje: Ya existe un cliente con ese teléfono
                  detalles: [{ campo: telefono, mensaje: El teléfono ya está registrado a nombre de Ana Gómez, clienteId: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10 }]
                  requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a
    delete:
      tags: [Clientes]
      operationId: eliminarCliente
      summary: Eliminar los datos personales de un cliente (solo administrador)
      description: >-
        HU-52. Borra de forma irreversible al cliente, sus vehículos, sus autorizaciones y sus notificaciones.
        Las órdenes entregadas se conservan sin vehículo para las estadísticas. Queda registro en la auditoría,
        sin datos personales.
      responses:
        '204': { description: Cliente eliminado. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El cliente tiene un servicio en curso; no se elimina nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501': { $ref: '#/components/responses/NoImplementado' }

  /clientes/{id}/consentimientos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Datos personales]
      operationId: listarConsentimientosCliente
      summary: Evidencia de autorización del cliente (solo administrador)
      description: Historial de autorizaciones y revocaciones del titular, de la más reciente a la más antigua (HU-51).
      responses:
        '200':
          description: Historial de autorizaciones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimiento' }
              example:
                - { tipo: tratamiento_datos, otorgado: true, canal: panel, politicaVersion: '1.0', fecha: '2026-10-28T14:05:12Z' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{id}/autorizaciones:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Datos personales]
      operationId: cambiarAutorizacionCliente
      summary: Otorgar o revocar una autorización de notificaciones
      description: |
        El titular pide en el establecimiento recibir o dejar de recibir avisos del servicio o promociones
        (HU-30). Se guarda como evidencia nueva con fecha, hora, canal `panel`, versión vigente de la política
        y el usuario que lo registró (CA4). Si la autorización ya estaba así, no se agrega ninguna fila (`cambio: false`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioAutorizacion' }
            example: { tipo: comerciales, otorgado: false }
      responses:
        '200':
          description: Autorizaciones vigentes después del cambio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cambio: { type: boolean }
                  autorizaciones: { $ref: '#/components/schemas/Autorizaciones' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /vehiculos:
    get:
      tags: [Vehículos]
      operationId: listarVehiculos
      summary: Listar o buscar vehículos por placa
      description: Vehículos del establecimiento, ordenados por placa, con su cliente (HU-05).
      parameters:
        - name: placa
          in: query
          description: Texto contenido en la placa; ignora mayúsculas, espacios y guiones (máximo 20 caracteres).
          schema: { type: string, maxLength: 20 }
          example: ABC123
      responses:
        '200':
          description: Lista de vehículos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VehiculoConCliente' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Vehículos]
      operationId: crearVehiculo
      summary: Registrar un vehículo asociado a un cliente
      description: >-
        HU-05 CA1 y CA2. La placa se guarda en mayúsculas, sin espacios ni guiones, y no se repite en el establecimiento.
        El cliente debe ser del establecimiento de la sesión; si no, responde `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiculoNuevo' }
            example: { clienteId: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10, placa: abc-123, tipo: carro, marca: Mazda, color: Rojo }
      responses:
        '201':
          description: Vehículo registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La placa ya está registrada en el establecimiento; `detalles` indica a qué cliente pertenece.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: CONFLICTO
                  mensaje: Ya existe un vehículo con esa placa
                  detalles: [{ campo: placa, mensaje: La placa ya está registrada a nombre de Ana Gómez, clienteId: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10 }]
                  requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a

  /vehiculos/{id}/historial:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Vehículos]
      operationId: obtenerHistorialVehiculo
      summary: Historial de servicios de un vehículo
      description: >-
        HU-06. Órdenes entregadas del vehículo, de la más reciente a la más antigua, con los precios guardados en cada orden.
        Si no tiene servicios previos responde una lista vacía. Un vehículo de otro establecimiento responde `404`.
      responses:
        '200':
          description: Historial del vehículo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServicioHistorial' }
              example:
                - { ordenId: 7c2d1e8a-5b43-4f1c-8d66-1f7e0c2a9b11, fecha: '2026-10-28T14:05:12Z', servicios: [{ nombre: Lavado premium, precio: 45000 }], subtotal: 45000, descuento: 0, total: 45000 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /servicios:
    get:
      tags: [Servicios]
      operationId: listarServicios
      summary: Catálogo de servicios del establecimiento
      description: >-
        HU-07. Servicios ordenados por nombre. Con `?activo=true` solo devuelve los disponibles para
        nuevas órdenes (CA3); `?activo=false` devuelve solo los desactivados.
      parameters:
        - name: activo
          in: query
          description: Filtra por servicios activos o inactivos. Sin el parámetro devuelve todos.
          schema: { type: boolean }
          example: true
      responses:
        '200':
          description: Servicios ordenados por nombre.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Servicios]
      operationId: crearServicio
      summary: Crear un servicio (solo administrador)
      description: HU-07 CA1. El nuevo servicio queda activo y disponible para órdenes nuevas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioNuevo' }
            example: { nombre: Lavado básico, precio: 25000, duracionMin: 30 }
      responses:
        '201':
          description: Servicio creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /servicios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Servicios]
      operationId: actualizarServicio
      summary: Editar, activar o desactivar un servicio (solo administrador)
      description: >-
        HU-07 CA1 a CA3. Se envían solo los campos a cambiar (al menos uno). Cambiar el precio no altera
        órdenes pasadas, que conservan su precio y duración; desactivar solo impide usarlo en órdenes nuevas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioCambios' }
            example: { precio: 30000 }
      responses:
        '200':
          description: Servicio actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /ordenes/activas:
    get:
      tags: [Órdenes]
      operationId: listarOrdenesActivas
      summary: Órdenes activas para el dashboard (HU-09)
      description: Órdenes del establecimiento que aún no se han entregado, de la más antigua a la más reciente.
      responses:
        '200':
          description: Órdenes activas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Orden' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /ordenes:
    post:
      tags: [Órdenes]
      operationId: crearOrden
      summary: Registrar el ingreso de un vehículo
      description: >-
        HU-08 (RF-F3-01 a RF-F3-04, CA1 y CA2). Crea la orden en `recibido` con los servicios y precios
        del momento, aplica la mejor promoción vigente, calcula la entrega estimada y genera el código de
        seguimiento. Acepta un vehículo registrado o crea cliente, consentimiento y vehículo en la misma
        transacción. Un vehículo con una orden activa responde `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdenNueva' }
            examples:
              registrado:
                summary: Vehículo ya registrado
                value:
                  vehiculoId: 11111111-1111-4111-8111-111111111111
                  servicioIds: [22222222-2222-4222-8222-222222222222, 33333333-3333-4333-8333-333333333333]
                  observaciones: Rayón en la puerta
              nuevo:
                summary: Cliente y vehículo nuevos
                value:
                  servicioIds: [22222222-2222-4222-8222-222222222222]
                  nuevoVehiculo:
                    cliente:
                      nombre: Ana Gómez
                      telefono: '3001234567'
                      correo: ana@example.com
                      autorizacionDatos: true
                      politicaVersion: '1.1'
                    vehiculo: { placa: XYZ987, tipo: carro, marca: Mazda, color: Rojo }
      responses:
        '201':
          description: Orden creada y lista para el dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
              example:
                id: 55555555-5555-4555-8555-555555555555
                estado: recibido
                subtotal: 55000
                descuento: 0
                total: 55000
                codigoSeguimiento: ABCDEFGHJK
                entregaEstimadaAt: '2026-11-02T15:10:00.000Z'
                observaciones: null
                created_at: '2026-11-02T14:00:00.000Z'
                entregada_at: null
                vehiculo: { id: 11111111-1111-4111-8111-111111111111, placa: XYZ987, tipo: carro, marca: Mazda, color: Rojo, cliente: { id: c1, nombre: Ana Gómez, telefono: '3001234567' } }
                servicios:
                  - { id: 22222222-2222-4222-8222-222222222222, nombre: Lavado básico, precio: 25000, duracionMin: 30, descuento: 0 }
                promocion: null
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /ordenes/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Órdenes]
      operationId: cambiarEstadoOrden
      summary: Avanzar o revertir el estado de una orden
      description: >-
        HU-10 CA1 a CA3. Avanza por el flujo `recibido -> en_lavado -> (secado) -> listo ->
        entregado`; `en_lavado` también puede pasar directo a `listo`. Cualquier otra transición
        responde `409`. Cada cambio guarda estado anterior, nuevo, usuario y hora en el historial
        y deja el evento `orden.estado_cambiado` para que HU-46 notifique al cliente. Al llegar a
        `entregado` se guarda `entregada_at` y la orden pasa al historial del vehículo.
        `{ "revertir": true }` deshace el último cambio durante los 60 segundos siguientes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdenCambioEstado' }
            examples:
              avanzar: { summary: Pasar a secado, value: { estado: secado } }
              revertir: { summary: Deshacer el último cambio, value: { revertir: true } }
      responses:
        '200':
          description: Orden actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La transición no es válida, la orden ya cambió o pasó el tiempo de reversión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ordenes/{id}/novedades:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Órdenes]
      operationId: registrarNovedadOrden
      summary: Registrar una novedad del vehículo
      description: >-
        HU-20 y RF-F7-17. El operario registra una novedad sobre una orden en curso. Si el tipo
        es `demora`, `minutosExtra` es obligatorio y la entrega estimada suma esos minutos; el
        seguimiento público recibe la nueva hora sin recargar. Los demás tipos no cambian la
        entrega estimada y no admiten `minutosExtra`. Una orden entregada responde `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovedadNueva' }
            examples:
              demora:
                summary: Reportar 15 minutos de demora
                value: { tipo: demora, minutosExtra: 15, mensaje: El vehículo requiere un segundo lavado }
              dano:
                summary: Registrar un daño preexistente
                value: { tipo: dano_preexistente, mensaje: Rayón en la puerta delantera }
      responses:
        '201':
          description: Novedad registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Novedad' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La orden ya fue entregada y no admite novedades.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /promociones:
    get:
      tags: [Promociones]
      operationId: listarPromociones
      summary: Listar promociones por estado
      description: >-
        HU-12 (RF-F4-02, RF-F4-06). El estado lo calcula la base con la fecha de Bogotá: `programada` (aún no empieza),
        `vigente` (hoy está entre inicio y fin, ambos incluidos), `vencida` (ya pasó su fin; ocurre sola, CA2) o
        `desactivada` (la apagó el administrador; solo aparece en `todas`). Las vigentes son las que verá el cliente final (CA1).
      parameters:
        - name: estado
          in: query
          description: Filtro por estado. Por defecto `todas`.
          schema: { type: string, enum: [vigentes, programadas, vencidas, todas], default: todas }
      responses:
        '200':
          description: Promociones del establecimiento, de la más reciente a la más antigua por fecha de inicio.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promocion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Promociones]
      operationId: crearPromocion
      summary: Crear una promoción (solo administrador)
      description: >-
        HU-12 CA1 (RF-F4-01). Descuento entero de 1 a 100, fecha de fin igual o posterior al inicio y a hoy, y al menos
        un servicio del catálogo del establecimiento. Promoción y servicios se guardan juntos o no se guarda nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromocionNueva' }
            example:
              nombre: Martes de motor
              descripcion: 20 % en el lavado de motor
              condiciones: Válida de lunes a viernes
              descuentoPct: 20
              fechaInicio: '2026-11-01'
              fechaFin: '2026-11-30'
              servicioIds: [6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10]
      responses:
        '201':
          description: Promoción creada, con su estado calculado y sus servicios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /promociones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Promociones]
      operationId: actualizarPromocion
      summary: Editar, activar o desactivar una promoción (solo administrador)
      description: >-
        HU-12 (RF-F4-03). Se envían solo los campos que cambian; `servicioIds` reemplaza la lista completa. Desactivar
        (`activa: false`) no la borra. Los cambios no alteran órdenes ya creadas, que guardan su propio precio y descuento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromocionCambios' }
            examples:
              desactivar: { summary: Desactivar, value: { activa: false } }
              extender: { summary: Extender la vigencia, value: { fechaFin: '2026-12-15' } }
      responses:
        '200':
          description: Promoción actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /reportes/servicios:
    get:
      tags: [Reportes]
      operationId: listarReporteServicios
      summary: Ranking de servicios por número de órdenes e ingresos (solo administrador)
      description: >-
        HU-16 CA1. Cuenta cada orden una sola vez por servicio, aunque tenga varios servicios.
        Los ingresos usan el precio y el descuento guardados en la orden al crearla, no el precio
        actual del catálogo. El rango incluye completos el día `desde` y el día `hasta`, en hora
        de Bogotá. Si no hay órdenes, `servicios` queda vacío y `totalOrdenes` es 0.
      parameters:
        - name: desde
          in: query
          required: true
          description: Primer día del rango, en formato AAAA-MM-DD y hora de Bogotá.
          schema: { type: string, format: date }
          example: '2026-11-01'
        - name: hasta
          in: query
          required: true
          description: Último día del rango (incluido), en formato AAAA-MM-DD y hora de Bogotá.
          schema: { type: string, format: date }
          example: '2026-11-03'
      responses:
        '200':
          description: Ranking de servicios del rango, de mayor a menor número de órdenes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteServicios' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /reportes/afluencia:
    get:
      tags: [Reportes]
      operationId: listarReporteAfluencia
      summary: Vehículos por día de la semana y franja horaria (solo administrador)
      description: >-
        HU-16 CA2. Cada orden representa un ingreso de vehículo; si el mismo vehículo vuelve,
        cuenta como una visita nueva. La matriz tiene 7 filas (lunes a domingo) por 12 franjas
        fijas de dos horas, calculadas en hora de Bogotá. El rango incluye completos el día
        `desde` y el día `hasta`. Si no hay órdenes, `totalVehiculos` es 0 y la matriz queda en ceros.
      parameters:
        - name: desde
          in: query
          required: true
          description: Primer día del rango, en formato AAAA-MM-DD y hora de Bogotá.
          schema: { type: string, format: date }
          example: '2026-11-01'
        - name: hasta
          in: query
          required: true
          description: Último día del rango (incluido), en formato AAAA-MM-DD y hora de Bogotá.
          schema: { type: string, format: date }
          example: '2026-11-03'
      responses:
        '200':
          description: Afluencia de vehículos del rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteAfluencia' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /notificaciones:
    get:
      tags: [Notificaciones]
      operationId: listarBitacoraNotificaciones
      summary: Bitácora de notificaciones del establecimiento (solo administrador)
      description: |
        HU-34. Lista las notificaciones enviadas o programadas por el establecimiento de la sesión, con fecha,
        hora, cliente, placa, canal (correo, SMS o push), tipo (operativa o comercial) y estado. Los filtros se
        pueden combinar y la paginación es del lado del servidor.

        El destino se devuelve **enmascarado** (`300****567`, `yel****@gmail.com`): el dato original está cifrado
        y nunca sale completo al panel. `estado: enviada` con `aceptadaPorProveedor: true` significa que el
        proveedor recibió el mensaje; `entregada: true` solo cuando el proveedor confirmó la entrega
        (`estado: entregada` o `contenido.entregaConfirmada`). Son estados distintos.
      parameters:
        - name: placa
          in: query
          required: false
          description: Placa del vehículo (búsqueda parcial, sin espacios).
          schema: { type: string }
          example: ABC123
        - name: desde
          in: query
          required: false
          description: Primer día del rango (incluido), en formato AAAA-MM-DD y hora de Bogotá.
          schema: { type: string, format: date }
          example: '2026-11-01'
        - name: hasta
          in: query
          required: false
          description: Último día del rango (incluido), en formato AAAA-MM-DD y hora de Bogotá.
          schema: { type: string, format: date }
          example: '2026-11-10'
        - name: canal
          in: query
          required: false
          schema: { type: string, enum: [push, sms, correo] }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [programada, pendiente, enviando, enviada, entregada, fallida, cancelada] }
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [operativa, comercial, recordatorio, novedad, correccion, sistema] }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: porPagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de la bitácora, de la más reciente a la más antigua.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BitacoraNotificaciones' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /notificaciones/{id}:
    get:
      tags: [Notificaciones]
      operationId: obtenerBitacoraNotificacion
      summary: Detalle de una notificación y de cada intento de envío (solo administrador)
      description: |
        HU-34. Devuelve el mismo registro enmascarado del listado más `intentos`, la auditoría de cada intento:
        número, canal, resultado, proveedor, si el error era recuperable, el motivo real y si el proveedor
        confirmó la entrega. `detalleIntentos: false` significa que la tabla de auditoría todavía no está
        disponible en el ambiente (el resto de la notificación se muestra igual).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Notificación con el detalle de sus intentos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificacionDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Listar operarios del establecimiento (solo administrador)
      description: >-
        HU-02 CA1. Devuelve únicamente los perfiles con rol `operario` del establecimiento de la sesión.
        El correo se lee de Supabase Auth (la tabla `perfiles` no lo almacena) y nunca se expone la
        `service_role`. Los administradores y demás establecimientos no aparecen.
      responses:
        '200':
          description: Operarios del establecimiento.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Crear un operario e invitarlo por correo (solo administrador)
      description: >-
        HU-02 CA1. Envía una invitación de Supabase Auth para que el operario establezca su propia
        contraseña y crea su perfil con rol fijo `operario` en el establecimiento de la sesión.
        El cliente no puede fijar `rol`, `establecimiento_id` ni contraseña. Si el correo ya existe
        responde 409, sin distinguir entre establecimientos. Si la cuenta de Auth se crea pero el
        correo de invitación no puede enviarse (SMTP, límite de envíos o URL de redirección), la
        respuesta incluye `invitacion.enlace` con un enlace seguro de un solo uso para compartir
        manualmente. La respuesta con enlace se envía con `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioNuevo' }
            example: { nombre: Laura Gómez, correo: laura@example.com }
      responses:
        '201':
          description: >-
            Operario creado. `invitacion.enviada` indica si el correo de invitación salió; si es
            `false`, `invitacion.enlace` trae el enlace seguro de respaldo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AltaUsuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Editar o activar/desactivar un operario (solo administrador)
      description: >-
        HU-02 CA2 y CA3. Solo permite cambiar `nombre` y `activo` de un operario del mismo
        establecimiento. El correo es de solo lectura y el rol nunca se modifica. Un administrador o
        superadministrador no puede editarse por esta ruta. Desactivar conserva el historial y bloquea
        el acceso en la siguiente petición, aunque el token siga vigente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioCambios' }
            examples:
              editarNombre: { value: { nombre: Laura Gómez } }
              desactivar: { value: { activo: false } }
      responses:
        '200':
          description: Operario actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /establecimiento:
    get:
      tags: [Establecimiento]
      operationId: obtenerEstablecimiento
      summary: Datos y branding del establecimiento de la sesión
      responses:
        '200':
          description: Establecimiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /establecimiento/branding:
    put:
      tags: [Establecimiento]
      operationId: actualizarBranding
      summary: Guardar los colores de la sede (solo administrador)
      description: HU-13 CA1 y CA2 (RF-F4-08). Ambos colores son obligatorios, en formato `#RRGGBB`; se guardan en mayúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandingEntrada' }
            example: { colorPrimario: '#0F766E', colorSecundario: '#F59E0B' }
      responses:
        '200':
          description: Establecimiento con los colores guardados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /establecimiento/logo:
    post:
      tags: [Establecimiento]
      operationId: subirLogo
      summary: Subir o reemplazar el logo de la sede (solo administrador)
      description: >-
        HU-13 CA1, CA2 y CA3 (RF-F4-07). Acepta un PNG o JPG de máximo 2 MB; el formato se comprueba por el contenido
        del archivo, no por su extensión. Se guarda en el bucket público `logos/{establecimientoId}/` y el logo anterior se borra.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: Imagen PNG o JPG de máximo 2 MB.
            encoding:
              logo: { contentType: 'image/png, image/jpeg' }
      responses:
        '200':
          description: Establecimiento con la URL pública del logo nuevo en `logo_url`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '400':
          description: Archivo ausente, de otro formato o de más de 2 MB. `detalles` indica los requisitos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: VALIDACION
                  mensaje: El archivo supera 2 MB
                  detalles: [{ campo: logo, mensaje: El logo debe ser una imagen PNG o JPG de máximo 2 MB }]
                  requestId: 1f0c9a7e-5b2d-4c1e-8a3f-6d9e0b7c2a14
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /superadmin/establecimientos:
    get:
      parameters:
        - in: query
          name: estado
          schema:
            type: string
            enum: [prueba, activo, pendiente_activacion, suspendido]
        - in: query
          name: buscar
          schema:
            type: string
            maxLength: 120
      tags: [Superadministración]
      operationId: listarEstablecimientosSuperadmin
      summary: Listar todos los establecimientos (solo superadministrador)
      description: >-
        HU-57 CA2. Devuelve el listado global de establecimientos y, antes de responder, marca como
        `pendiente_activacion` los que superaron su período de prueba.
      responses:
        '200':
          description: Establecimientos de la plataforma.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstablecimientoSuperadmin' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Superadministración]
      operationId: crearEstablecimientoSuperadmin
      summary: Registrar un establecimiento e invitar a su administrador (solo superadministrador)
      description: >-
        HU-57 CA1. Crea el establecimiento en estado `prueba` e invita por correo al administrador inicial.
        Si la invitación o la creación del perfil fallan, se compensan las operaciones ya realizadas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoEstablecimientoSuperadmin' }
            example: { nombre: Car Wash Central, plan: basico, correoAdministrador: admin@example.com, diasPrueba: 14 }
      responses:
        '201':
          description: Establecimiento creado e invitación enviada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AltaEstablecimientoSuperadmin' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /superadmin/establecimientos/{id}/reenviar-invitacion:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Superadministración]
      operationId: reenviarInvitacionSuperadmin
      summary: Reenviar la invitación al administrador inicial
      description: HU-57 CA1. Solo reenvía la invitación si el administrador aún no la ha aceptado y el establecimiento no está suspendido.
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                type: object
                required: [correo, enviada]
                properties:
                  correo: { type: string, format: email }
                  enviada: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /superadmin/establecimientos/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Superadministración]
      operationId: activarEstablecimientoSuperadmin
      summary: Activar un establecimiento (solo superadministrador)
      description: HU-57 CA3. Habilita el acceso del establecimiento suspendido o pendiente de activación.
      responses:
        '200':
          description: Establecimiento activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstablecimientoSuperadmin' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /superadmin/establecimientos/{id}/suspender:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Superadministración]
      operationId: suspenderEstablecimientoSuperadmin
      summary: Suspender un establecimiento (solo superadministrador)
      description: HU-57 CA3. Bloquea el acceso sin eliminar el establecimiento ni sus datos.
      responses:
        '200':
          description: Establecimiento suspendido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstablecimientoSuperadmin' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    bearerPanel:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de Supabase Auth del usuario del panel (dura 1 hora).
    paseCliente:
      type: http
      scheme: bearer
      bearerFormat: pase
      description: >-
        Pase firmado (HMAC) de 30 minutos emitido por POST /publico/sedes/{slug}/historial/acceso (HU-23).
        Identifica la sede y el cliente verificados con placa + celular. No es un JWT de Supabase; el panel
        no lo usa.

  headers:
    XRequestId:
      description: Identificador de la petición, para rastrearla en los registros del servidor.
      schema: { type: string }

  parameters:
    SlugSede:
      name: slug
      in: path
      required: true
      description: Identificador público de la sede en su enlace (HU-17). Minúsculas, letras, números y guiones.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
      example: car-wash-demo-cali
    CodigoSeguimiento:
      name: codigo
      in: path
      required: true
      description: Código de seguimiento de la orden (HU-08). No distingue mayúsculas; se ignoran espacios y guiones.
      schema: { type: string }
      example: 7KQ2M9XH4P
    Id:
      name: id
      in: path
      required: true
      description: Identificador UUID del recurso.
      schema: { type: string, format: uuid }
      example: 6b1c0f9e-3a43-4c1f-9d55-2e7d0c1a9b10

  responses:
    LimiteExcedido:
      description: Demasiados intentos desde el mismo origen. Espere unos minutos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { codigo: LIMITE_EXCEDIDO, mensaje: Demasiados intentos con códigos no válidos. Espera unos minutos e inténtalo de nuevo, requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }
    Validacion:
      description: Datos inválidos o incompletos. `detalles` indica qué corregir.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              codigo: VALIDACION
              mensaje: La solicitud tiene datos inválidos
              detalles: [{ campo: nombre, mensaje: El nombre es obligatorio }]
              requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a
    NoAutenticado:
      description: Token ausente, vencido o inválido. Debe iniciar sesión de nuevo.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Bearer error="invalid_token"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { codigo: NO_AUTENTICADO, mensaje: Tu sesión venció o no es válida. Inicia sesión de nuevo, requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }
    SinPermiso:
      description: El rol del usuario no tiene permiso o el usuario está desactivado. El intento queda en la auditoría.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { codigo: SIN_PERMISO, mensaje: No tienes permiso para realizar esta acción, requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }
    NoEncontrado:
      description: El recurso no existe o pertenece a otro establecimiento (no se distingue).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: Cliente no encontrado, requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }
    Conflicto:
      description: El dato ya existe (por ejemplo, teléfono o placa repetidos).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoImplementado:
      description: Ruta definida pero pendiente de desarrollo en la historia indicada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { codigo: NO_IMPLEMENTADO, mensaje: Pendiente de desarrollo (HU-05), requestId: 5f6ec373-1b0e-4f0b-8c3a-6f1e2d3c4b5a }

  schemas:
    SedePublica:
      type: object
      description: Lo que el cliente final ve de su sede (HU-17). Los colores son null si la sede no los configuró.
      required: [slug, nombre]
      properties:
        slug: { type: string, example: car-wash-demo-cali }
        nombre: { type: string, example: Car Wash Demo Cali }
        logoUrl: { type: [string, 'null'], format: uri }
        colorPrimario: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        colorSecundario: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
    BusquedaPublica:
      type: object
      description: Placa O celular (exactamente uno). Se ignoran espacios, guiones y el prefijo +57.
      properties:
        placa: { type: string, maxLength: 30, example: ABC123 }
        celular: { type: string, maxLength: 30, example: '3001234567' }
    ResultadoBusquedaPublica:
      type: object
      required: [sede, resultados]
      properties:
        sede: { $ref: '#/components/schemas/SedePublica' }
        resultados:
          type: array
          minItems: 1
          items:
            type: object
            required: [codigo, placa]
            properties:
              codigo: { type: string, example: 7KQ2M9XH4P }
              placa: { type: string, example: ABC123 }
    Seguimiento:
      type: object
      description: Vista pública de una orden para el cliente final (HU-18). Sin datos personales.
      properties:
        codigo: { type: string }
        estado: { type: string, enum: [recibido, en_lavado, secado, listo, entregado] }
        etapa:
          type: object
          properties:
            estado: { type: string }
            titulo: { type: string, example: Lavado iniciado }
            descripcion: { type: string }
            paso: { type: integer, example: 2 }
            totalPasos: { type: integer, example: 5 }
        etapas:
          type: array
          description: >-
            Línea de tiempo del lavado (HU-19): todas las etapas en orden, con las completadas, la actual
            y las pendientes. `secado` es opcional y queda `omitida` si no se usó; al entregar el vehículo
            todas las etapas quedan completadas.
          items:
            type: object
            properties:
              estado: { type: string }
              titulo: { type: string }
              completada: { type: boolean }
              actual: { type: boolean }
              omitida: { type: boolean }
              at: { type: [string, 'null'], format: date-time, description: Hora en que la orden llegó a la etapa }
              terminadaAt: { type: [string, 'null'], format: date-time, description: Hora en que terminó la etapa (solo si está completada) }
        estadoDesde: { type: [string, 'null'], format: date-time }
        ingresoAt: { type: [string, 'null'], format: date-time }
        entregaEstimadaAt: { type: [string, 'null'], format: date-time }
        entregadaAt: { type: [string, 'null'], format: date-time }
        vehiculo:
          type: object
          properties:
            placa: { type: [string, 'null'] }
            tipo: { type: [string, 'null'] }
            marca: { type: [string, 'null'] }
            color: { type: [string, 'null'] }
        servicios:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              precio: { type: number }
              duracionMin: { type: integer, minimum: 0, description: Duración contratada del servicio. }
        subtotal: { type: number }
        descuento: { type: number }
        total: { type: number }
        notaPago: { type: string, example: El pago se realiza en el establecimiento }
        establecimiento:
          type: object
          properties:
            nombre: { type: string }
            logoUrl: { type: [string, 'null'] }
            colorPrimario: { type: string }
            colorSecundario: { type: string }
        version: { type: integer, description: Aumenta con cada cambio de estado o de la entrega estimada. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje, requestId]
          properties:
            codigo:
              type: string
              enum: [VALIDACION, NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, CONFLICTO, CARGA_DEMASIADO_GRANDE, HTTPS_REQUERIDO, IDEMPOTENCIA_CONFLICTO, LIMITE_EXCEDIDO, ERROR_INTERNO, NO_IMPLEMENTADO]
              description: |
                Código estable para el frontend. Estado HTTP: VALIDACION 400, NO_AUTENTICADO 401, SIN_PERMISO 403,
                NO_ENCONTRADO 404, CONFLICTO 409, CARGA_DEMASIADO_GRANDE 413, HTTPS_REQUERIDO 426, IDEMPOTENCIA_CONFLICTO 422,
                LIMITE_EXCEDIDO 429, ERROR_INTERNO 500, NO_IMPLEMENTADO 501.
            mensaje: { type: string, description: Mensaje para el usuario. Nunca contiene detalles internos. }
            detalles:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetalle' }
            requestId: { type: string }

    ErrorDetalle:
      type: object
      required: [mensaje]
      properties:
        campo: { type: string, description: Campo que debe corregirse (por ejemplo `telefono` o `body`). }
        mensaje: { type: string, description: Qué debe corregirse. }
      additionalProperties: true

    Salud:
      type: object
      properties:
        ok: { type: boolean }
        servicio: { type: string }
        version: { type: string }
        commit:
          type: string
          description: Commit desplegado (`local` fuera de Render). Lo usa la prueba de humo de producción.
        fecha: { type: string, format: date-time }

    Sesion:
      type: object
      properties:
        usuario:
          type: object
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            rol: { type: string, enum: [admin, operario, superadmin] }
        establecimiento:
          oneOf:
            - { $ref: '#/components/schemas/Establecimiento' }
            - { type: 'null' }
        permisos:
          type: object
          properties:
            modulos:
              type: array
              items: { type: string }
            inicio: { type: string }
        sesion:
          type: object
          properties:
            expiraEn: { type: [string, 'null'], format: date-time }

    ClienteNuevo:
      type: object
      required: [nombre, telefono, correo, autorizacionDatos, politicaVersion]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, pattern: '^3\d{9}$', description: Celular colombiano de 10 dígitos. }
        correo: { type: string, format: email, maxLength: 254, description: Obligatorio desde la política 1.1; es un canal de notificación (HU-46). }
        autorizacionDatos: { type: boolean, const: true, description: Autorización de tratamiento de datos (Ley 1581 de 2012). }
        autorizaNotificaciones: { type: boolean, default: false, description: 'HU-30 CA1: casilla separada y desmarcada por defecto para los avisos del estado del vehículo.' }
        autorizaComerciales: { type: boolean, default: false, description: 'HU-30 CA1: casilla separada y desmarcada por defecto para promociones del establecimiento.' }
        politicaVersion: { type: string, pattern: '^\d+\.\d+$', description: Versión de la política aceptada (de GET /politicas-datos/vigente). }

    Politica:
      type: object
      properties:
        version: { type: string }
        titulo: { type: string }
        contenido: { type: string, description: Texto de la política en Markdown. }
        vigenteDesde: { type: string, format: date-time }

    CambioAutorizacion:
      type: object
      required: [tipo, otorgado]
      properties:
        tipo: { type: string, enum: [notificaciones_servicio, comerciales] }
        otorgado: { type: boolean, description: true para autorizar; false para revocar. }

    AutorizacionVigente:
      type: object
      properties:
        otorgado: { type: boolean }
        fecha: { type: [string, 'null'], format: date-time }
        canal: { type: [string, 'null'], enum: [panel, app, enlace_baja, migracion, null] }
        politicaVersion: { type: [string, 'null'] }

    Autorizaciones:
      type: object
      description: Autorizaciones vigentes del titular (HU-30). Las campañas comerciales solo van a quien tiene `comerciales.otorgado` (CA2).
      properties:
        tratamientoDatos: { $ref: '#/components/schemas/AutorizacionVigente' }
        notificacionesServicio: { $ref: '#/components/schemas/AutorizacionVigente' }
        comerciales: { $ref: '#/components/schemas/AutorizacionVigente' }

    BajaPublica:
      type: object
      properties:
        tipo: { type: string, enum: [notificaciones_servicio, comerciales] }
        nombreTipo: { type: string, example: Promociones y ofertas }
        autorizado: { type: boolean }
        sede:
          type: object
          properties:
            nombre: { type: string }
            logoUrl: { type: [string, 'null'] }
            colorPrimario: { type: [string, 'null'] }
            colorSecundario: { type: [string, 'null'] }

    Consentimiento:
      type: object
      properties:
        tipo: { type: string, enum: [tratamiento_datos, notificaciones_servicio, comerciales] }
        otorgado: { type: boolean, description: true si autorizó; false si revocó. }
        canal: { type: string, enum: [panel, app, enlace_baja, migracion] }
        politicaVersion: { type: [string, 'null'], description: Nulo solo en autorizaciones anteriores al versionado (canal migracion). }
        fecha: { type: string, format: date-time }

    ClienteCambios:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        telefono: { type: string, pattern: '^3\d{9}$' }
        correo: { type: string, format: email, maxLength: 254, description: No se puede vaciar. }

    ClienteResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        telefono: { type: string }
        correo: { type: [string, 'null'] }
        vehiculos:
          type: array
          items:
            type: object
            properties:
              placa: { type: string }

    Cliente:
      type: object
      properties:
        id: { type: string, format: uuid }
        establecimiento_id: { type: string, format: uuid }
        nombre: { type: string }
        telefono: { type: string }
        correo: { type: [string, 'null'] }
        autorizacion_datos: { type: boolean }
        fecha_autorizacion: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ClienteDetalle:
      allOf:
        - $ref: '#/components/schemas/Cliente'
        - type: object
          properties:
            vehiculos:
              type: array
              items: { $ref: '#/components/schemas/Vehiculo' }
            autorizaciones: { $ref: '#/components/schemas/Autorizaciones' }

    Vehiculo:
      type: object
      properties:
        id: { type: string, format: uuid }
        establecimiento_id: { type: string, format: uuid }
        cliente_id: { type: string, format: uuid }
        placa: { type: string }
        tipo: { type: string }
        marca: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    VehiculoConCliente:
      allOf:
        - $ref: '#/components/schemas/Vehiculo'
        - type: object
          properties:
            clientes:
              type: object
              properties:
                id: { type: string, format: uuid }
                nombre: { type: string }

    ServicioHistorial:
      type: object
      properties:
        ordenId: { type: string, format: uuid }
        fecha: { type: string, format: date-time, description: Fecha de entrega. }
        servicios:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              precio: { type: number, description: Precio guardado en la orden. }
        subtotal: { type: number }
        descuento: { type: number }
        total: { type: number }

    VehiculoNuevo:
      type: object
      required: [clienteId, placa, tipo]
      properties:
        clienteId: { type: string, format: uuid }
        placa: { type: string, description: 'Carro: ABC123. Moto: ABC12D o ABC12. Se aceptan minúsculas, espacios y guiones.' }
        tipo: { type: string, enum: [carro, moto] }
        marca: { type: [string, 'null'], maxLength: 40 }
        color: { type: [string, 'null'], maxLength: 30 }

    VehiculoDatos:
      type: object
      required: [placa, tipo]
      properties:
        placa: { type: string, description: 'Carro: ABC123. Moto: ABC12D o ABC12. Se aceptan minúsculas, espacios y guiones.' }
        tipo: { type: string, enum: [carro, moto] }
        marca: { type: [string, 'null'], maxLength: 40 }
        color: { type: [string, 'null'], maxLength: 30 }

    OrdenNueva:
      description: >-
        Indica exactamente una forma de vehículo: `vehiculoId` para uno registrado, o `nuevoVehiculo`
        para crear cliente, consentimiento y vehículo junto con la orden. Los servicios repetidos se
        cuentan una vez.
      oneOf:
        - $ref: '#/components/schemas/OrdenConVehiculoRegistrado'
        - $ref: '#/components/schemas/OrdenConVehiculoNuevo'

    OrdenConVehiculoRegistrado:
      type: object
      required: [vehiculoId, servicioIds]
      properties:
        vehiculoId: { type: string, format: uuid }
        servicioIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        observaciones: { type: [string, 'null'], maxLength: 500 }

    OrdenConVehiculoNuevo:
      type: object
      required: [nuevoVehiculo, servicioIds]
      properties:
        nuevoVehiculo:
          type: object
          required: [cliente, vehiculo]
          properties:
            cliente: { $ref: '#/components/schemas/ClienteNuevo' }
            vehiculo: { $ref: '#/components/schemas/VehiculoDatos' }
        servicioIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        observaciones: { type: [string, 'null'], maxLength: 500 }

    OrdenServicio:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        precio: { type: number, description: Precio copiado al crear la orden. }
        duracionMin: { type: integer }
        descuento: { type: number, description: Descuento aplicado por la mejor promoción vigente. }

    NovedadNueva:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [demora, dano_preexistente, objeto_encontrado, otro] }
        mensaje: { type: [string, 'null'], maxLength: 300 }
        minutosExtra:
          type: [integer, 'null']
          minimum: 1
          description: Obligatorio solo para `demora`; se suma a la entrega estimada.
      additionalProperties: false

    Novedad:
      type: object
      properties:
        id: { type: string, format: uuid }
        ordenId: { type: string, format: uuid }
        tipo: { type: string, enum: [demora, dano_preexistente, objeto_encontrado, otro] }
        mensaje: { type: [string, 'null'] }
        minutosExtra: { type: [integer, 'null'] }
        fotos:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        entregaEstimadaAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    OrdenCambioEstado:
      description: Indica un estado nuevo o la reversión del último cambio, pero no ambos.
      oneOf:
        - type: object
          required: [estado]
          additionalProperties: false
          properties:
            estado: { type: string, enum: [recibido, en_lavado, secado, listo, entregado] }
        - type: object
          required: [revertir]
          additionalProperties: false
          properties:
            revertir: { type: boolean, enum: [true] }

    Orden:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [recibido, en_lavado, secado, listo, entregado] }
        version: { type: integer, minimum: 1, description: Se incrementa en cada cambio de estado o de la entrega estimada. }
        subtotal: { type: number }
        descuento: { type: number }
        total: { type: number }
        codigoSeguimiento:
          type: string
          pattern: '^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{10}$'
          description: Código público de seguimiento, sin caracteres ambiguos.
        entregaEstimadaAt: { type: string, format: date-time }
        observaciones: { type: [string, 'null'], maxLength: 500 }
        created_at: { type: string, format: date-time }
        entregada_at: { type: [string, 'null'], format: date-time }
        vehiculo:
          type: object
          properties:
            id: { type: string, format: uuid }
            placa: { type: string }
            tipo: { type: string, enum: [carro, moto] }
            marca: { type: [string, 'null'] }
            color: { type: [string, 'null'] }
            cliente:
              type: object
              properties:
                id: { type: string, format: uuid }
                nombre: { type: string }
                telefono: { type: string }
        servicios:
          type: array
          items: { $ref: '#/components/schemas/OrdenServicio' }
        promocion:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            descuento_pct: { type: number }

    Servicio:
      type: object
      properties:
        id: { type: string, format: uuid }
        establecimiento_id: { type: string, format: uuid }
        nombre: { type: string }
        precio: { type: number, minimum: 0 }
        duracion_min: { type: integer, minimum: 1 }
        activo: { type: boolean }
        created_at: { type: string, format: date-time }

    ServicioNuevo:
      type: object
      required: [nombre, precio, duracionMin]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        precio: { type: number, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01 }
        duracionMin: { type: integer, minimum: 1 }
      additionalProperties: false

    ServicioCambios:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        precio: { type: number, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01 }
        duracionMin: { type: integer, minimum: 1 }
        activo: { type: boolean }
      additionalProperties: false

    Promocion:
      type: object
      properties:
        id: { type: string, format: uuid }
        establecimiento_id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        condiciones: { type: [string, 'null'] }
        descuento_pct: { type: number, minimum: 1, maximum: 100 }
        fecha_inicio: { type: string, format: date }
        fecha_fin: { type: string, format: date }
        activa: { type: boolean }
        estado: { type: string, enum: [programada, vigente, vencida, desactivada] }
        servicios:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
        created_at: { type: string, format: date-time }

    PromocionNueva:
      type: object
      required: [nombre, descuentoPct, fechaInicio, fechaFin, servicioIds]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        descripcion: { type: [string, 'null'], maxLength: 500 }
        condiciones: { type: [string, 'null'], maxLength: 500 }
        descuentoPct: { type: integer, minimum: 1, maximum: 100 }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date, description: Igual o posterior a fechaInicio y a hoy (Bogotá). }
        servicioIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        activa: { type: boolean, default: true }

    PromocionCambios:
      type: object
      minProperties: 1
      description: Mismos campos que PromocionNueva, todos opcionales. La fecha de fin puede quedar en el pasado (terminar la promoción antes).
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        descripcion: { type: [string, 'null'], maxLength: 500 }
        condiciones: { type: [string, 'null'], maxLength: 500 }
        descuentoPct: { type: integer, minimum: 1, maximum: 100 }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        servicioIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        activa: { type: boolean }

    Usuario:
      type: object
      description: Operario del establecimiento. El correo vive en Supabase Auth, no en `perfiles`.
      required: [id, nombre, correo, rol, activo, created_at]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email, description: Correo de la cuenta de Supabase Auth. }
        rol: { type: string, enum: [operario] }
        activo: { type: boolean, description: 'Si es false, el operario no puede usar el panel.' }
        created_at: { type: [string, 'null'], format: date-time }

    UsuarioNuevo:
      type: object
      required: [nombre, correo]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 254 }

    UsuarioCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        activo: { type: boolean }

    AltaUsuario:
      type: object
      required: [usuario, invitacion]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        invitacion:
          type: object
          description: >-
            Resultado de la invitación. Si el correo no pudo enviarse, `enlace` contiene un enlace
            de un solo uso que el administrador debe compartir por un medio seguro.
          required: [correo, enviada]
          properties:
            correo: { type: string, format: email }
            enviada: { type: boolean, description: 'true si Supabase envió el correo de invitación.' }
            enlace:
              type: string
              format: uri
              description: Enlace seguro de respaldo; solo aparece cuando `enviada` es false.

    Establecimiento:
      type: object
      description: >-
        `nombre`, `logo_url`, `color_primario` y `color_secundario` forman el branding de la sede, el mismo que verá el
        cliente final (RF-F4-09). `logo_url` es pública: se abre sin sesión.
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        logo_url: { type: [string, 'null'], format: uri }
        color_primario: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$', example: '#2563EB' }
        color_secundario: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$', example: '#0EA5E9' }

    BrandingEntrada:
      type: object
      required: [colorPrimario, colorSecundario]
      properties:
        colorPrimario: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#0F766E' }
        colorSecundario: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#F59E0B' }

    EstablecimientoSuperadmin:
      type: object
      description: Establecimiento visto desde la administración global (HU-57).
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        plan: { type: string, enum: [basico, intermedio, empresarial] }
        estado: { type: string, enum: [prueba, pendiente_activacion, activo, suspendido] }
        prueba_inicia_at: { type: [string, 'null'], format: date-time }
        prueba_finaliza_at: { type: [string, 'null'], format: date-time }
        activado_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        dias_restantes: { type: [integer, 'null'], minimum: 0 }
        administrador:
          oneOf:
            - type: object
              properties:
                nombre: { type: string }
                correo: { type: [string, 'null'], format: email }
                invitacionAceptada: { type: [boolean, 'null'] }
            - type: 'null'

    NuevoEstablecimientoSuperadmin:
      type: object
      required: [nombre, plan, correoAdministrador, diasPrueba]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        plan: { type: string, enum: [basico, intermedio, empresarial] }
        correoAdministrador: { type: string, format: email, maxLength: 254 }
        diasPrueba: { type: integer, minimum: 14, maximum: 30 }

    AltaEstablecimientoSuperadmin:
      type: object
      required: [establecimiento, invitacion]
      properties:
        establecimiento: { $ref: '#/components/schemas/EstablecimientoSuperadmin' }
        invitacion:
          type: object
          required: [correo, enviada]
          properties:
            correo: { type: string, format: email }
            enviada: { type: boolean }

    ReporteServicio:
      type: object
      required: [servicioId, nombre, ordenes, ingresos]
      properties:
        servicioId: { type: string, format: uuid }
        nombre: { type: string }
        ordenes: { type: integer, minimum: 0, description: Órdenes distintas que incluyen el servicio. }
        ingresos:
          type: number
          minimum: 0
          description: Suma histórica de precio menos descuento de las líneas de la orden.

    ReporteServicios:
      type: object
      required: [desde, hasta, totalOrdenes, servicios]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        totalOrdenes: { type: integer, minimum: 0 }
        servicios:
          type: array
          items: { $ref: '#/components/schemas/ReporteServicio' }

    ReporteAfluencia:
      type: object
      required: [desde, hasta, totalVehiculos, dias, franjas, matriz, porDia, porFranja]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        totalVehiculos: { type: integer, minimum: 0 }
        dias:
          type: array
          description: Siete días, de lunes a domingo.
          items: { type: string }
          minItems: 7
          maxItems: 7
        franjas:
          type: array
          description: Doce franjas fijas de dos horas, de 00:00 a 24:00.
          items: { type: string }
          minItems: 12
          maxItems: 12
        matriz:
          type: array
          description: Filas por día (lunes primero) y columnas por franja (00:00 primero).
          items:
            type: array
            items: { type: integer, minimum: 0 }
        porDia:
          type: array
          items:
            type: object
            required: [dia, vehiculos]
            properties:
              dia: { type: string }
              vehiculos: { type: integer, minimum: 0 }
        porFranja:
          type: array
          items:
            type: object
            required: [franja, vehiculos]
            properties:
              franja: { type: string }
              vehiculos: { type: integer, minimum: 0 }

    AccesoHistorial:
      type: object
      required: [placa, celular]
      properties:
        placa:
          type: string
          description: Placa del vehículo; se normaliza a mayúsculas y sin espacios.
          example: ABC123
        celular:
          type: string
          description: Celular registrado para el cliente en esa sede (10 dígitos; acepta +57, espacios y guiones).
          example: '3001234567'

    AccesoHistorialRespuesta:
      type: object
      required: [pase, expiraEn, sede, cliente]
      properties:
        pase:
          type: string
          description: 'Pase firmado para las rutas del historial. Enviar como `Authorization: Bearer <pase>`.'
        expiraEn: { type: string, format: date-time }
        sede:
          type: object
          required: [slug, nombre]
          properties:
            slug: { type: string }
            nombre: { type: string }
        cliente:
          type: object
          required: [nombre]
          properties:
            nombre: { type: string }

    VehiculoCliente:
      type: object
      required: [id, placa]
      properties:
        id: { type: string, format: uuid }
        placa: { type: string }
        tipo: { type: [string, 'null'] }
        marca: { type: [string, 'null'] }
        color: { type: [string, 'null'] }

    ServicioHistorialCliente:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string }
        precio: { type: number, minimum: 0 }
        descuento: { type: number, minimum: 0 }

    RegistroHistorialCliente:
      type: object
      required: [id, fecha, sede, placa, tipoLavado, servicios, total]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: [string, 'null'] }
        fecha: { type: string, format: date-time, description: Fecha de entrega (o de creación si faltara). }
        sede: { type: [string, 'null'], description: Nombre de la sede afiliada donde se hizo el servicio. }
        placa: { type: [string, 'null'] }
        tipoLavado: { type: string, description: 'Servicios realizados, unidos con " + ".' }
        servicios:
          type: array
          items: { $ref: '#/components/schemas/ServicioHistorialCliente' }
        total: { type: number, minimum: 0 }

    HistorialCliente:
      type: object
      required: [cliente, sede, historial, vehiculos]
      properties:
        cliente:
          type: object
          required: [nombre]
          properties:
            nombre: { type: string }
        sede: { type: [string, 'null'] }
        historial:
          type: array
          items: { $ref: '#/components/schemas/RegistroHistorialCliente' }
        vehiculos:
          type: array
          items: { $ref: '#/components/schemas/VehiculoCliente' }

    DetalleHistorialCliente:
      type: object
      required: [cliente, servicio]
      properties:
        cliente:
          type: object
          required: [nombre]
          properties:
            nombre: { type: string }
        servicio:
          type: object
          required: [id, fecha, sede, placa, tipoLavado, servicios, subtotal, descuento, total]
          properties:
            id: { type: string, format: uuid }
            codigo: { type: [string, 'null'] }
            fecha: { type: string, format: date-time }
            sede: { type: [string, 'null'] }
            placa: { type: [string, 'null'] }
            vehiculo:
              type: object
              properties:
                tipo: { type: [string, 'null'] }
                marca: { type: [string, 'null'] }
                color: { type: [string, 'null'] }
            tipoLavado: { type: string }
            servicios:
              type: array
              items: { $ref: '#/components/schemas/ServicioHistorialCliente' }
            subtotal: { type: number, minimum: 0 }
            descuento: { type: number, minimum: 0 }
            total: { type: number, minimum: 0 }

    NotificacionCliente:
      type: object
      required: [id, tipo, categoria, evento, titulo, canal, fecha, leida, placa, destino]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [operativa, comercial, recordatorio, novedad, correccion, sistema] }
        categoria: { type: string, description: 'Texto visible del tipo, p. ej. "Estado del servicio".' }
        evento: { type: string, example: orden.lista }
        titulo: { type: string, example: Tu vehículo ABC123 está listo para recoger }
        canal: { type: string, enum: [push, sms, correo] }
        fecha: { type: string, format: date-time }
        leida: { type: boolean }
        placa: { type: [string, 'null'] }
        destino:
          description: HU-38 CA3. Pantalla a la que lleva un aviso de estado; `null` en los demás.
          oneOf:
            - type: 'null'
            - type: object
              required: [pantalla, codigo]
              properties:
                pantalla: { type: string, const: seguimiento }
                codigo: { type: string }
            - type: object
              required: [pantalla, ordenId]
              properties:
                pantalla: { type: string, const: historial }
                ordenId: { type: string, format: uuid }

    CentroNotificacionesCliente:
      type: object
      required: [notificaciones, noLeidas]
      properties:
        notificaciones:
          type: array
          items: { $ref: '#/components/schemas/NotificacionCliente' }
        noLeidas: { type: integer, minimum: 0, description: HU-38 CA2. Avisos de la lista sin leer. }

    Notificacion:
      type: object
      required: [id, fecha, tipo, canal, estado, aceptadaPorProveedor, entregada, totalIntentos]
      properties:
        id: { type: string, format: uuid }
        fecha: { type: string, format: date-time }
        tipo: { type: string, enum: [operativa, comercial, recordatorio, novedad, correccion, sistema] }
        evento: { type: [string, 'null'], example: orden.lista }
        canal: { type: string, enum: [push, sms, correo] }
        estado: { type: string, enum: [programada, pendiente, enviando, enviada, entregada, fallida, cancelada] }
        cliente: { type: [string, 'null'] }
        placa: { type: [string, 'null'] }
        codigoSeguimiento: { type: [string, 'null'] }
        destino:
          type: [string, 'null']
          description: Destino enmascarado; nunca el celular ni el correo completos.
          example: '300****567'
        asunto: { type: [string, 'null'] }
        proveedor: { type: [string, 'null'] }
        aceptadaPorProveedor: { type: boolean, description: El proveedor recibió el mensaje (estado enviada o entregada). }
        entregada: { type: boolean, description: El proveedor confirmó la entrega real. }
        entregadaAt: { type: [string, 'null'], format: date-time }
        totalIntentos: { type: integer, minimum: 0 }
        error: { type: [string, 'null'], description: Motivo real del último fallo del proveedor. }
        programadaPara: { type: [string, 'null'], format: date-time }
        proximoIntentoAt: { type: [string, 'null'], format: date-time }

    NotificacionIntento:
      type: object
      required: [intento, canal, resultado, entregado, fecha]
      properties:
        intento: { type: integer, minimum: 1 }
        canal: { type: string, enum: [push, sms, correo] }
        resultado: { type: string, enum: [enviado, fallido] }
        proveedor: { type: [string, 'null'] }
        idProveedor: { type: [string, 'null'] }
        entregado: { type: boolean }
        recuperable: { type: [boolean, 'null'], description: Si el error se podía reintentar. }
        error: { type: [string, 'null'] }
        fecha: { type: string, format: date-time }

    NotificacionDetalle:
      allOf:
        - $ref: '#/components/schemas/Notificacion'
        - type: object
          required: [intentos, detalleIntentos]
          properties:
            intentos:
              type: array
              items: { $ref: '#/components/schemas/NotificacionIntento' }
            detalleIntentos:
              type: boolean
              description: false si la tabla de auditoría todavía no está aplicada en el ambiente.

    BitacoraNotificaciones:
      type: object
      required: [notificaciones, paginacion]
      properties:
        notificaciones:
          type: array
          items: { $ref: '#/components/schemas/Notificacion' }
        paginacion:
          type: object
          required: [pagina, porPagina, total, totalPaginas]
          properties:
            pagina: { type: integer, minimum: 1 }
            porPagina: { type: integer, minimum: 1 }
            total: { type: integer, minimum: 0 }
            totalPaginas: { type: integer, minimum: 0 }
